// The Gradle build supplies the app's name, version, main class and per-machine classpath.
include "#!../gradlew -q -p .. :desktopApp:printConveyorConfig"

// Extracts JNA/SQLite native libraries at install time instead of on first run.
// See https://hydraulic.dev/blog/11-in-jar-signing.html
include required("https://raw.githubusercontent.com/hydraulic-software/conveyor/master/configs/jvm/extract-native-libraries.conf")

// Config documentation: https://conveyor.hydraulic.dev/latest/configs

gradle-cache = ${env.HOME}/.gradle

app {
  machines = [ windows.amd64, mac.amd64, mac.aarch64, linux.amd64.glibc, linux.aarch64.glibc ]

  // Conveyor is free for open-source projects that point here.
  vcs-url = "https://github.com/homebase-id/soundhouse"

  icons = ../icons/icon.png

  updates = aggressive

  jvm {
    extract-native-libraries = true
    jna.library.path = <libpath>

    system-properties {
      java.net.useSystemProxies = true
      // Main.kt sets jna.nosys=true, which skips java.library.path; extraction strips jnidispatch from the jar.
      jna.boot.library.path = <libpath>
    }

    // The loopback stream server.
    modules += jdk.httpserver
    // Ed25519 provider and modern TLS.
    modules += jdk.crypto.ec
  }

  mac {
    info-plist {
      LSMinimumSystemVersion = 15.0
      NSMicrophoneUsageDescription = "Allow access to the microphone to record audio for your library."
    }
  }
}

conveyor {
  compatibility-level = 21
}
