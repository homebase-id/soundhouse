name: Build Mobile Release Production

# Builds id.homebase.audio for the Play internal track; promote it with
# "Promote Android Release to public". A tag push also attaches the bundle to a GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64_ENCODED }}
          PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PLAY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error ::Android release secrets aren't configured. See .github/RELEASING.md."
            exit 1
          fi

  build-android:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set Android version
        id: version
        run: .github/scripts/ci-version.sh ${{ github.run_number }}

      - name: Decode upload keystore
        id: keystore
        env:
          ENCODED: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64_ENCODED }}
        run: |
          path="$RUNNER_TEMP/keystore/upload.keystore"
          mkdir -p "$(dirname "$path")"
          printf '%s' "$ENCODED" | base64 -d > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build Android bundle
        run: |
          ./gradlew --no-daemon :androidApp:bundleRelease \
            -PVERSION_CODE=${{ steps.version.outputs.VERSION_CODE }} \
            -PVERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}"
        env:
          SIGNING_KEYSTORE_FILE_PATH: ${{ steps.keystore.outputs.path }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          JDK_21: ${{ env.JAVA_HOME }}

      - name: Rename output
        run: |
          mv androidApp/build/outputs/bundle/release/androidApp-release.aab \
             androidApp/build/outputs/bundle/release/soundhouse.aab

      - uses: actions/upload-artifact@v6
        with:
          name: soundhouse-android
          path: androidApp/build/outputs/bundle/release/soundhouse.aab

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-mapping-${{ steps.version.outputs.VERSION_CODE }}
          path: androidApp/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Write Google Play service account key
        env:
          PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_KEY" > google-play-key.json

      - name: Publish to Google Play internal track
        run: ./gradlew :androidApp:publishReleaseBundle --artifact-dir androidApp/build/outputs/bundle/release

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: soundhouse-android
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
